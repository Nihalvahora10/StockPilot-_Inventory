services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: StockPilot API
      ENVIRONMENT: development
      SECRET_KEY: local-compose-secret-change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: postgresql+psycopg://stockpilot:stockpilot@db:5432/stockpilot
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: stockpilot
    ports:
      - "5432:5432"
    volumes:
      - stockpilot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  stockpilot_data:
